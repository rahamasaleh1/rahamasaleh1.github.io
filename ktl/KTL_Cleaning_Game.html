<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KTL Home Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1222;--muted:#64748b;--bg:#f8fafc;--card:#fff;--primary:#2563eb;--success:#10b981;--warn:#f59e0b;--error:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;z-index:10}
.logo{font-weight:800;color:var(--primary)}
.stars{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border-radius:999px;padding:6px 10px;font-weight:800}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.select,.toggle,.btn{border:2px solid #e5e7eb;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.container{max-width:900px;margin:0 auto;padding:16px}
.journey{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px}
.journey-title{font-weight:800;color:var(--muted)}
.journey-track{display:flex;gap:8px;overflow:auto;padding:6px 0}
.node{min-width:84px;height:84px;border:2px solid #e5e7eb;border-radius:14px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center}
.node{cursor:pointer}
.node:hover{border-color:var(--primary)}
.node:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.node.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.node.done{background:linear-gradient(135deg,#10b981,#059669);border-color:#059669}
.node small{font-size:10px;font-weight:800}
.node.done small{color:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:18px;margin-top:16px}
.header-row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.badge{padding:4px 10px;border-radius:999px;background:#dbeafe;color:#1e40af;font-weight:800}
.progress{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:8px 0}
.fill{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#06b6d4);transition:width .4s}
.avatar{display:flex;gap:10px;align-items:center}
.meter{flex:1;height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.meter>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef4444,#10b981)}
.play{min-height:260px;background:#f8fafc;border:2px dashed #cbd5e1;border-radius:12px;padding:14px;margin:12px 0}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{min-height:180px;background:#fff;border:3px dashed #cbd5e1;border-radius:12px;padding:12px}
.zone.drag{background:#dbeafe;border-color:var(--primary)}
.zone-head{font-weight:800;text-align:center;border-bottom:2px solid #e5e7eb;padding-bottom:6px}
.item{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:12px;min-width:96px;text-align:center;cursor:grab;user-select:none;display:inline-block;margin:6px}
.icon{font-size:40px}
/* for SVG clothing icons (white shirts, dark trousers, etc.) */
.icon svg{
  width:40px;
  height:40px;
  display:block;
  margin:0 auto;
}
.label{font-size:12px;font-weight:700;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.step{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:12px;text-align:center;font-weight:800;cursor:pointer}
.step.done{background:linear-gradient(135deg,#10b981,#059669);border-color:#059669;color:#fff}
.step.wrong{border-color:var(--error)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:800}
.btn.primary{background:var(--primary);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.secondary{background:#f1f5f9;border:2px solid #e5e7eb}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;z-index:1000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:1200}
.modal.show{display:flex}
.modal-body{background:#fff;border-radius:16px;padding:18px;max-width:520px;width:100%}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:1100}
.rtl{direction:rtl}
.rtl .journey-track{direction:ltr}
@media (max-width:640px){
  .zone-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="header">
  <div class="logo">🏠 KTL Home Skills</div>
  <div class="controls">
    <span class="stars" id="stars">⭐ 0</span>
    <select id="lang" class="select" aria-label="Language">
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ar">العربية</option>

      <option value="so">Soomaali</option>
      <option value="am">አማርኛ</option>
      <option value="om">Afaan Oromoo</option>
      <option value="tig">ትግሬ</option>
      <option value="nus">Nuer</option>
      <option value="ff">Fulfulde</option>
    </select>
    <select id="difficulty" class="select" aria-label="Difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <label class="toggle"><input id="speedMode" type="checkbox" /> ⏱️ <span id="lblSpeed">Speed</span></label>
    <label class="toggle"><input id="mute" type="checkbox" /> 🔇 <span id="lblMute">Mute</span></label>
    <button class="btn secondary" id="helpBtn">❓ <span id="lblHelp">Help</span></button>
    <button class="btn secondary" id="achBtn">🏅 <span id="lblAch">Achievements</span></button>
  </div>
</header>

<section class="journey">
  <div class="journey-title" id="journeyTitle">Your Progress</div>
  <div class="journey-track" id="track"></div>
</section>

<main class="container">
  <article class="card">
    <div class="header-row">
      <h1 id="taskTitle">Task 1: Sorting Rubbish</h1>
      <div>
        <span class="badge" id="badge">Easy</span>
        <span class="badge" id="timer" style="display:none">60s</span>
      </div>
    </div>

    <div class="avatar">🧍
      <div class="meter"><span id="cleanBar"></span></div>
      <strong id="cleanPct" style="min-width:42px;text-align:right">0%</strong>
    </div>

    <div id="scenario" style="background:#fff4db;border-left:4px solid var(--warn);padding:10px;border-radius:8px;margin:10px 0"></div>
    <div id="instructions" style="background:#f1f5f9;border-left:4px solid var(--primary);padding:10px;border-radius:8px;margin:10px 0"></div>

    <div class="progress"><div class="fill" id="fill"></div></div>

    <div id="game" class="play"></div>

    <div class="actions">
      <button class="btn secondary" id="speakBtn">🔊 <span id="lblVoice">Voice</span></button>
      <button class="btn primary" id="check">✓ <span id="lblCheck">Check</span></button>
      <button class="btn success" id="next" style="display:none"><span id="lblNext">Next</span> ▶</button>
      <button class="btn secondary" id="reset"><span id="lblReset">Reset</span></button>
    </div>

    <div style="background:#e8efff;border-left:4px solid var(--primary);padding:10px;border-radius:8px;margin-top:10px">
      <strong>💡 <span id="lblTip">Tip</span></strong>
      <div id="tip">Recycling helps the environment and saves money.</div>
    </div>
  </article>
</main>

<!-- Help -->
<div class="modal" id="help">
  <div class="modal-body">
    <h3 id="helpTitle">Need help?</h3>
    <div id="helpContent"></div>
    <div style="text-align:right;margin-top:10px">
      <button class="btn primary" id="closeHelp"><span id="lblHelpOk">OK</span></button>
    </div>
  </div>
</div>

<!-- Achievements -->
<div class="modal" id="achievements">
  <div class="modal-body">
    <h3 id="achTitle">Achievements</h3>
    <ul id="achList" style="padding-left:18px"></ul>
    <div style="text-align:right;margin-top:10px">
      <button class="btn primary" id="closeAch"><span id="lblAchOk">OK</span></button>
    </div>
  </div>
</div>

<!-- Result / End-of-game modal (for “Better luck next time”, scores, restart, etc.) -->
<div class="modal" id="resultModal">
  <div class="modal-body">
    <h3 id="resultTitle">Result</h3>
    <p id="resultMessage" style="margin-top:6px">Better luck next time!</p>
    <div style="text-align:right;margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn secondary" id="btnEndGame">⏹ <span id="lblEndGame">End game</span></button>
      <button class="btn primary" id="btnRestart">🔁 <span id="lblRestart">Start again</span></button>
      <button class="btn primary" id="btnNextTask" style="display:none">▶ <span id="lblNextTask">Next</span></button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

// Simple WebAudio beeps (no external files)
const AudioKit=(()=>{
  let ctx;
  function beep(freq=660,ms=120,type='sine',gain=0.05){
    if(window.__MUTED__) return;
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=gain;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      setTimeout(()=>{ o.stop(); o.disconnect(); g.disconnect(); }, ms);
    }catch(e){/* ignore */}
  }
  return {beep};
})();

// Game state
const state = {
  lang: localStorage.getItem('ktl_lang') || 'en',
  task: +(localStorage.getItem('ktl_task') || 0),
  stars: +(localStorage.getItem('ktl_stars') || 0),
  done: JSON.parse(localStorage.getItem('ktl_done') || '[]'),
  difficulty: localStorage.getItem('ktl_diff') || 'easy',
  speed: JSON.parse(localStorage.getItem('ktl_speed') || 'false'),
  muted: JSON.parse(localStorage.getItem('ktl_mute') || 'false')
};

function save(){
  localStorage.setItem('ktl_lang', state.lang);
  localStorage.setItem('ktl_task', state.task);
  localStorage.setItem('ktl_stars', state.stars);
  localStorage.setItem('ktl_done', JSON.stringify(state.done));
  localStorage.setItem('ktl_diff', state.difficulty);
  localStorage.setItem('ktl_speed', JSON.stringify(state.speed));
  localStorage.setItem('ktl_mute', JSON.stringify(state.muted));
}

function t(){ return L[state.lang] || L.en; }

// UI renderers
function renderJourney(){
  $('#journeyTitle').textContent = noDash(t().ui.progress);
  const track = $('#track'); 
  track.innerHTML='';
  const EMOJI={rubbish:'🗑️',laundry:'👕',hands:'🧼',kitchen:'🍽️'};
  t().tasks.forEach((task,i)=>{
    const d=document.createElement('div');
    d.className='node'+(state.task===i?' active':'')+(state.done.includes(i)?' done':'');
    d.innerHTML = `${EMOJI[task.key]||'⭐'}<small>${noDash(task.title.split(' ')[0])}</small>`;
    d.tabIndex=0; d.setAttribute('role','button'); d.setAttribute('aria-label', noDash(task.title));
    const go=()=>{ stopTimer(); state.task=i; save(); $('#resultModal').classList.remove('show'); renderTask(); renderJourney(); if(state.speed) startTimer(); };
    d.addEventListener('click',go);
    d.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    track.appendChild(d);
  });
  $('#stars').textContent = `⭐ ${state.stars}`;
}

// simple shuffle helper
function shuffle(arr){
  return arr
    .map(v=>({v, r:Math.random()}))
    .sort((a,b)=>a.r-b.r)
    .map(o=>o.v);
}

    const R = lang.items?.rubbish || {};
    const base=[
      {icon:'🥫',type:'recycle',label:R.can||'Can'},
      {icon:'🥤',type:'recycle',label:R.bottle||'Bottle'},
      {icon:'📄',type:'recycle',label:R.paper||'Paper'},
      {icon:'🍌',type:'trash',label:R.food||'Food'},
      {icon:'🧻',type:'trash',label:R.tissue||'Tissue'}
    ];
    let items;
    if(state.difficulty==='hard'){
      items=[...base,
        {icon:'📦',type:'recycle',label:R.cardboard||'Cardboard'},
        {icon:'🧃',type:'recycle',label:R.carton||'Carton'}
      ];
    } else if(state.difficulty==='medium'){
      items=[...base,
        {icon:'📦',type:'recycle',label:R.cardboard||'Cardboard'}
      ];
    } else {
      items=base;
    }
    renderSorting(g,items,[
      {zone:'recycle',title:lang.bins.recycle},
      {zone:'trash',title:lang.bins.trash}
    ]);

  } else if(infoKey==='laundry'){
    // laundry items with SVG for shirts / tops / dark trousers etc.
    const Ld = lang.items?.laundry || {};

    const svgWhiteShirt = `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 10 L32 4 L44 10 L40 20 L40 52 H24 L24 20 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
      </svg>`;
    const svgLightTop = `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 12 L32 6 L46 12 L42 24 L42 50 H22 L22 24 Z" fill="#e5f0ff" stroke="#cbd5e1" stroke-width="2"/>
      </svg>`;
    const svgBlackJacket = `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 8 L30 8 L34 20 L38 8 L50 8 L46 52 H18 Z" fill="#111827" stroke="#4b5563" stroke-width="2"/>
      </svg>`;
    const svgJeans = `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 8 H42 L40 56 H34 L32 34 L30 56 H24 Z" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
      </svg>`;
    const svgDress = `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M28 8 H36 L40 20 L46 34 L40 56 H24 L18 34 L24 20 Z" fill="#f9a8d4" stroke="#f472b6" stroke-width="2"/>
      </svg>`;

    const base=[
      {icon:svgWhiteShirt,type:'lights',label:Ld.whiteShirt||'White Shirt'},
      {icon:'🧦',type:'lights',label:Ld.whiteSocks||'White Socks'}, // socks stay emoji
      {icon:svgLightTop,type:'lights',label:Ld.lightTop||'Light Top'},
      {icon:svgBlackJacket,type:'darks',label:Ld.blackJacket||'Black Jacket'},
      {icon:svgJeans,type:'darks',label:Ld.jeans||'Jeans'}
    ];
    let items;
    if(state.difficulty==='hard'){
      items=[...base,
        {icon:'🧣',type:'darks',label:Ld.scarf||'Scarf'},
        {icon:svgDress,type:'lights',label:Ld.dress||'Dress'}
      ];
    } else if(state.difficulty==='medium'){
      items=[...base,
        {icon:'🧣',type:'darks',label:Ld.scarf||'Scarf'}
      ];
    } else {
      items=base;
    }
    renderSorting(g,items,[
      {zone:'lights',title:lang.laundry.lights},
      {zone:'darks',title:lang.laundry.darks}
    ]);

  } else if(infoKey==='hands'){
    renderSequence(g, buildHandsSteps(lang));

  } else { // kitchen
    renderSequence(g, buildKitchenSteps(lang));
  }

  if(state.speed){ 
    startTimer(); 
  } else { 
    stopTimer(); 
    $('#timer').style.display='none'; 
  }
  renderJourney();
}

function buildHandsSteps(lang){
  const S = lang.steps?.hands || {};
  const order = ['wet','soap','scrub','rinse','dry'];

  let use;
  if(state.difficulty==='hard') use = order;
  else if(state.difficulty==='medium') use = order.slice(0,4);
  else use = order.slice(0,3); // easier: fewer steps

  const emojiMap = {
    wet:'💧',
    soap:'🧼',
    scrub:'🫧',
    rinse:'💦',
    dry:'🧻'
  };

  const steps = use.map((key,idx)=>({
    idx, 
    emoji: emojiMap[key] || '🔹',
    label: S[key] || key
  }));

  // display shuffled but order is encoded in idx
  return shuffle(steps);
}

function buildKitchenSteps(lang){
  const S = lang.steps?.kitchen || {};
  const order = ['scrape','rinse1','soap','scrub','rinse2','dry'];

  let use;
  if(state.difficulty==='hard') use = order;
  else if(state.difficulty==='medium') use = order.slice(0,5);
  else use = order.slice(0,4); // easy: fewer actions

  const emojiMap = {
    scrape:'🗑️',
    rinse1:'💦',
    soap:'🧼',
    scrub:'🧽',
    rinse2:'💦',
    dry:'🧻'
  };

  const steps = use.map((key,idx)=>({
    idx,
    emoji: emojiMap[key] || '🔹',
    label: S[key] || key
  }));

  return shuffle(steps);
}

function renderSorting(root,items,zones){
  const pool=document.createElement('div'); 
  pool.className='play';
  const bag=document.createElement('div');

  items.forEach((it,i)=>{
    const el=document.createElement('div'); 
    el.className='item'; 
    el.draggable=true; 
    el.tabIndex=0; 
    el.dataset.type=it.type; 
    el.dataset.id=i;
    el.innerHTML = `<div class="icon">${it.icon}</div><div class="label">${noDash(it.label)}</div>`;
    el.addEventListener('dragstart',e=>{
      AudioKit.beep(520,60); 
      e.dataTransfer.setData('text/plain',JSON.stringify({id:i,type:it.type}));
      el.style.opacity=.5;
    });
    el.addEventListener('dragend',()=>{el.style.opacity=1;});
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){
        const first=document.querySelector('.zone'); 
        if(first) first.appendChild(el); 
        updateProgress(); 
        AudioKit.beep(520,60);
      }
    });
    bag.appendChild(el);
  });
  pool.appendChild(bag);

  const grid=document.createElement('div'); 
  grid.className='zone-grid';
  zones.forEach(z=>{
    const dz=document.createElement('div'); 
    dz.className='zone'; 
    dz.dataset.zone=z.zone; 
    dz.innerHTML=`<div class="zone-head">${z.zone==='recycle'?'♻️':'🧺'} ${noDash(z.title)}</div>`;
    dz.addEventListener('dragover',e=>{e.preventDefault(); dz.classList.add('drag');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
    dz.addEventListener('drop',e=>{
      e.preventDefault(); 
      dz.classList.remove('drag'); 
      try{
        const data=JSON.parse(e.dataTransfer.getData('text/plain')); 
        const el=document.querySelector(`.item[data-id="${data.id}"]`); 
        if(el){ 
          dz.appendChild(el); 
          updateProgress(); 
          AudioKit.beep(600,60,'triangle'); 
        }
      }catch(err){}
    });
    grid.appendChild(dz);
  });

  root.appendChild(pool); 
  root.appendChild(grid);
}

function renderSequence(root,steps){
  seq=[];
  const wrap=document.createElement('div'); 
  wrap.className='steps';
  steps.forEach(step=>{
    const b=document.createElement('button'); 
    b.className='step'; 
    b.type='button'; 
    b.innerHTML=`<div class="icon">${step.emoji}</div>${noDash(step.label)}`;
    b.addEventListener('click',()=>handleStep(step.idx,b,steps.length));
    wrap.appendChild(b);
  });
  root.appendChild(wrap);
}

function handleStep(idx,el,total){
  if(seq.includes(idx)) return;
  if(idx===seq.length){
    seq.push(idx); 
    el.classList.add('done'); 
    updateProgress(); 
    AudioKit.beep(720,70,'square'); 
    if(seq.length===total){ 
      success(); 
    }
  } else {
    el.classList.add('wrong'); 
    setTimeout(()=>el.classList.remove('wrong'),240); 
    mistakes++; 
    AudioKit.beep(220,140,'sawtooth'); 
    toast(t().feedback.nope,false); 
  }
}

function updateProgress(){
  let pct=0; 
  const key=t().tasks[state.task].key;
  if(key==='rubbish'||key==='laundry'){
    const total=document.querySelectorAll('.item').length; 
    const placed=document.querySelectorAll('.zone .item').length; 
    if(total>0) pct=Math.round((placed/total)*100);
  } else { 
    const total=document.querySelectorAll('.step').length; 
    if(total>0) pct=Math.round((seq.length/total)*100); 
  }
  $('#fill').style.width=pct+'%'; 
  $('#cleanBar').style.width=pct+'%'; 
  $('#cleanPct').textContent=pct+'%';
}

function toast(text,ok=true){
  const old=document.querySelector('.toast'); 
  if(old) old.remove();
  const d=document.createElement('div'); 
  d.className='toast'; 
  d.textContent=noDash(text);
  document.body.appendChild(d); 
  setTimeout(()=>d.remove(),1800);
}

function showResult(win){
  const lang = t();
  const r = lang.result || {};
  $('#resultTitle').textContent = noDash(win ? (r.titleWin||'Well done!') : (r.titleLose||'Better luck next time'));
  $('#resultMessage').textContent = noDash(win ? (r.msgWin||'You finished this task.') : (r.msgLose||'You can try again.'));
  $('#lblRestart').textContent = noDash(r.playAgain || 'Start again');
  $('#lblEndGame').textContent = noDash(r.endGame || 'End game');
  $('#lblNextTask').textContent = noDash(lang.ui.next || 'Next');
  $('#btnNextTask').style.display = win ? 'inline-block' : 'none';
  $('#resultModal').classList.add('show');
}

function success(){
  if(state.speed && timeLeft<=0){
    toast('Time up',false); 
    showResult(false);
    return; 
  }
  toast(t().feedback.ok,true);
  AudioKit.beep(820,120); 
  setTimeout(()=>AudioKit.beep(980,120),130);
  state.stars += (state.difficulty==='hard'?20:state.difficulty==='medium'?15:10);
  if(!state.done.includes(state.task)) state.done.push(state.task);
  $('#stars').textContent=`⭐ ${state.stars}`;
  $('#check').style.display='none'; 
  $('#next').style.display='inline-block';
  confetti();
  save();
  showResult(true);
}

function startTimer(){
  stopTimer();
  const base = state.difficulty==='hard'?35:state.difficulty==='medium'?50:65;
  timeLeft = base;
  $('#timer').style.display='inline-block';
  $('#timer').textContent = base+'s';
  timer=setInterval(()=>{
    timeLeft--; 
    $('#timer').textContent=timeLeft+'s';
    if(timeLeft<=0){
      stopTimer(); 
      $('#timer').textContent='0s'; 
      toast('Time up',false); 
      $('#check').style.display='none'; 
      $('#next').style.display='inline-block'; 
      AudioKit.beep(180,260); 
      showResult(false);
    }
  },1000);
}
function stopTimer(){ 
  if(timer){clearInterval(timer); timer=null;} 
}

function confetti(){
  const c=$('#confetti'),
        ctx=c.getContext('2d'); 
  c.width=innerWidth;
  c.height=innerHeight;
  const P=[];
  for(let i=0;i<120;i++){
    P.push({
      x:Math.random()*c.width,
      y:-10,
      vx:(Math.random()-.5)*4,
      vy:Math.random()*3+2,
      s:Math.random()*6+3,
      c:`hsl(${Math.random()*360},90%,60%)`,
      r:Math.random()*6,
      vr:(Math.random()-.5)*.2
    });
  }
  (function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=.05;
      p.r+=p.vr;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.r);
      ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
      ctx.restore();
    });
    if(P.some(p=>p.y<c.height)) requestAnimationFrame(loop);
  })();
}

// Buttons
function check(){
  const key=t().tasks[state.task].key;
  if(key==='rubbish'||key==='laundry'){
    const zones=document.querySelectorAll('.zone'); 
    let ok=true, placed=0;
    zones.forEach(z=>{
      z.querySelectorAll('.item').forEach(it=>{
        placed++; 
        if(it.dataset.type!==z.dataset.zone){ 
          ok=false; 
          mistakes++; 
          it.style.borderColor='var(--error)'; 
          setTimeout(()=>it.style.borderColor='#e5e7eb',600); 
        }
      });
    });
    if(!placed){ 
      toast('Place the items first',false); 
      AudioKit.beep(220,160); 
      return; 
    }
    if(ok) success(); 
    else {
      toast(t().feedback.nope,false); 
      AudioKit.beep(220,160);
    }
  } else {
    const total=document.querySelectorAll('.step').length; 
    if(seq.length===total) success();
    else {
      toast('Finish the steps in order',false); 
      AudioKit.beep(220,160);
    }
  }
}

function next(){ 
  state.task=(state.task+1)%t().tasks.length; 
  save(); 
  $('#resultModal').classList.remove('show');
  renderTask(); 
  renderJourney(); 
}

function reset(){ 
  state.task=0; 
  state.stars=0; 
  state.done=[]; 
  save(); 
  $('#resultModal').classList.remove('show');
  renderTask(); 
  renderJourney(); 
  toast('Reset',true); 
}

// Mute + Speech
function setMute(on){
  state.muted = !!on;
  window.__MUTED__ = state.muted;
  if(state.muted && window.speechSynthesis){ 
    try{ speechSynthesis.cancel(); }catch(e){} 
  }
  save();
  $('#mute').checked = state.muted;
}

function speakCurrent(){
  if(state.muted) return;
  try{
    const info=t().tasks[state.task];
    const u=new SpeechSynthesisUtterance(noDash(`${info.title}. ${info.scenario}. ${info.instructions}`));
    u.lang = t().rtl ? 'ar-SA' : 'en-GB';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

// Init
function init(){
  // Seed UI selections
  $('#lang').value = state.lang;
  $('#difficulty').value = state.difficulty;
  $('#speedMode').checked = !!state.speed;
  setMute(state.muted);

  // Listeners
  $('#lang').addEventListener('change',e=>{ 
    state.lang=e.target.value; 
    save(); 
    renderTask(); 
    renderJourney(); 
  });
  $('#difficulty').addEventListener('change',e=>{ 
    state.difficulty=e.target.value; 
    save(); 
    renderTask(); 
  });
  $('#speedMode').addEventListener('change',e=>{ 
    state.speed=e.target.checked; 
    save(); 
    if(state.speed) startTimer(); else stopTimer(); 
  });
  $('#mute').addEventListener('change',e=>{ setMute(e.target.checked); });
  $('#check').addEventListener('click',check);
  $('#next').addEventListener('click',next);
  $('#reset').addEventListener('click',reset);
  $('#speakBtn').addEventListener('click',speakCurrent);

  // Help/Achievements modals
  $('#helpBtn').addEventListener('click',()=>{
    const h = t().help || {};
    $('#helpContent').innerHTML = (h.recycling||'') + (h.laundry||'');
    $('#help').classList.add('show');
  });
  $('#closeHelp').addEventListener('click',()=>$('#help').classList.remove('show'));
  $('#achBtn').addEventListener('click',()=>{
    const list = state.done.length 
      ? state.done.map(i=>`<li>${noDash(t().tasks[i].title)}</li>`).join('') 
      : '<li>—</li>';
    $('#achList').innerHTML = list;
    $('#achievements').classList.add('show');
  });
  $('#closeAch').addEventListener('click',()=>$('#achievements').classList.remove('show'));
  document.querySelectorAll('.modal').forEach(m=>{
    m.addEventListener('click',e=>{
      if(e.target.classList.contains('modal')) m.classList.remove('show');
    });
  });

  // result modal buttons
  $('#btnRestart').addEventListener('click',()=>{
    $('#resultModal').classList.remove('show');
    renderTask();
  });
  $('#btnNextTask').addEventListener('click',next);
  $('#btnEndGame').addEventListener('click',()=>{
    reset();
  });

  renderTask(); 
  renderJourney();
}

init();
